<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FEB3 BA</title>
<meta name="theme-color" content="#212121">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FEB3 BA">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cabin:wght@400;500;600;700&family=Roboto:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#1B1F24;--mut:#5B6169;--line:#E6E9ED;--bd:#D5DAE0;--tile:#EEF1F4;--bg:#E3E6EA;--navy:#1F4E78;--red:#DC143C;--org:#FF9C1B;--ven:#FDE8EC}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Cabin,"Gill Sans","Trebuchet MS",sans-serif;font-variant-numeric:tabular-nums}
body{min-height:100vh;display:flex;justify-content:center}
#app{width:100%;max-width:560px;min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
button{font-family:inherit;cursor:pointer;color:inherit}
a{color:var(--navy)}a:hover{color:var(--red)}
h1,h2,h3{margin:0}
.top{position:sticky;top:0;z-index:5}
.bar{display:flex;align-items:center;justify-content:space-between;min-height:44px;padding:env(safe-area-inset-top) 16px 0;background:#212121;color:#fff}
.bar h1{font-family:Roboto,sans-serif;font-weight:900;font-size:20px;letter-spacing:.14em}
.bar span{font-size:13px;letter-spacing:.06em}
.hero{display:flex;align-items:center;gap:14px;padding:12px 16px;color:#fff;background-color:#C8102E;background-image:linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.35)),linear-gradient(135deg,#FF9C1B 0%,#C8102E 100%)}
.hero img{width:64px;height:64px;flex-shrink:0;border-radius:6px;background:#fff;object-fit:contain}
.hero .t1{font-size:22px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;line-height:1.1}
.hero .t2{font-size:13px;font-style:italic;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-top:4px}
nav{display:flex;overflow-x:auto;scrollbar-width:none;background:#fff;border-bottom:1px solid var(--bd)}
nav::-webkit-scrollbar{display:none}
nav button{min-height:48px;background:#fff;border:0;border-bottom:3px solid transparent;color:var(--mut);font-size:14px;font-weight:700;letter-spacing:0;padding:0 14px;flex:1 0 auto;white-space:nowrap}
nav button[aria-current=page]{color:var(--red);border-bottom-color:var(--red)}
main{padding:14px 16px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.chips{display:flex;gap:6px;overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;min-height:44px;padding:0 14px;border-radius:999px;font-size:14px;font-weight:700;white-space:nowrap;background:#fff;color:var(--ink);border:1px solid #B8C4D0}
.chip[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
.hint{margin:0;font-size:13px;color:var(--mut)}
.list{display:flex;flex-direction:column;gap:8px}
.card{display:flex;flex-direction:column;background:#fff;border:1px solid var(--bd);border-radius:12px;overflow:hidden}
.card.v{background:var(--ven);border-color:var(--red)}
.card.open{border:2px solid var(--navy)}
.rowb{display:flex;align-items:center;gap:10px;width:100%;min-height:64px;padding:10px 12px;background:transparent;border:0;text-align:left}
.rank{width:24px;flex-shrink:0;font-family:Roboto,sans-serif;font-weight:700;font-size:20px;color:var(--mut)}
.mid{flex-grow:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.nm{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.big{display:flex;flex-direction:column;align-items:flex-end;flex-shrink:0}
.big b{font-family:Roboto,sans-serif;font-weight:900;font-size:28px;line-height:1}
.big i{font-style:normal;font-size:12px;color:var(--mut)}
.det{display:flex;flex-direction:column;gap:14px;padding:4px 12px 14px;border-top:1px solid var(--line)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding-top:12px}
.tile{display:flex;flex-direction:column;padding:6px 8px;background:var(--tile);border-radius:8px}
.tile b{font-family:Roboto,sans-serif;font-weight:700;font-size:20px;line-height:1.1}
.tile i{font-style:normal;font-size:11px;color:var(--mut)}
.sec{display:flex;flex-direction:column;gap:4px}
.sec h3{font-family:Roboto,sans-serif;font-weight:700;font-size:17px;text-transform:uppercase;letter-spacing:.08em}
.sec p{margin:0;font-size:12px;color:var(--mut)}
.tr{display:grid;grid-template-columns:var(--c);gap:4px;padding:5px 0;border-top:1px solid var(--line);font-size:13px;align-items:center}
.tr.h{border-top:0;padding:0;font-size:12px;font-weight:700;color:var(--mut)}
.tr .r{text-align:right}.tr .e{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.tr .b{font-weight:800}
.trend{display:grid;grid-template-columns:108px minmax(0,1fr) minmax(0,1fr) 36px;align-items:center;gap:0 4px;font-size:12px;padding:3px 0}
.trend .l{display:flex;justify-content:flex-end;border-right:1px solid #8A94A0}.trend .rr{display:flex}
.trend em{display:block;height:14px}
.chipvd{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;flex-shrink:0;border-radius:8px;font-weight:800;font-size:14px;background:var(--navy);color:#fff}
.chipvd.d{background:#fff;color:var(--ink);border:2px solid #8A94A0}
.gl{display:flex;align-items:center;gap:10px;padding:5px 0;border-top:1px solid var(--line);font-size:14px}
.gl span:nth-child(2){flex-grow:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gl strong{font-family:Roboto,sans-serif;font-size:18px}
.gm{display:flex;flex-direction:column;gap:6px;width:100%;min-height:64px;padding:10px 12px;background:transparent;border:0;text-align:left}
.gm small{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.gm div{display:flex;align-items:center;justify-content:space-between;gap:10px}
.gm .t{font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gm .s{font-family:Roboto,sans-serif;font-size:26px;line-height:1;font-weight:500}
.gm .w{font-weight:800}.gm .sw{font-weight:900}
.qc{padding:3px 0;border-radius:4px;font-weight:700}
.qb{background:transparent;border:0;padding:6px 0;min-height:36px;text-align:left;font-size:14px;font-weight:600;text-decoration:underline dotted #8A94A0;text-underline-offset:3px}
.qb.v{color:var(--red)}
.court{display:block;width:100%;max-width:420px;height:auto;margin:4px auto 0;background:#fff;border:1px solid var(--line);border-radius:8px}
.more{min-height:44px;background:#fff;border:1px solid var(--navy);border-radius:10px;font-weight:700;font-size:14px;color:var(--navy)}
.empty{margin:0;padding:14px 16px;background:#fff;border:1px dashed #B8C4D0;border-radius:12px;font-size:14px;color:var(--mut)}
.row2{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tg{flex-shrink:0;min-height:44px;padding:0 12px;border-radius:10px;font-size:13px;font-weight:700;background:#fff;color:var(--ink);border:1px solid #B8C4D0}
.tg[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
.gd{padding:10px 12px;background:#fff;border:1px solid var(--bd);border-radius:10px;display:flex;flex-direction:column;gap:1px}
.gd strong{font-size:14px}.gd span{font-size:13px;color:var(--mut);line-height:1.4}
.gs{display:flex;flex-direction:column;gap:6px}
.gs h2{font-family:Roboto,sans-serif;font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.08em}
.gs p{margin:0;font-size:14px;line-height:1.45}

.courts{display:grid;gap:10px;align-items:start;grid-template-columns:minmax(0,1fr)}
.rp{display:flex;flex-direction:column;gap:12px}
.rp-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.rp h2{font-family:Roboto,sans-serif;font-weight:900;font-size:24px;letter-spacing:.04em;text-transform:uppercase}
.rp p{margin:0;font-size:14px;line-height:1.5}
.rp ul{margin:0;padding-left:18px;font-size:14px;line-height:1.5}
.rp h4{margin:6px 0 0;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.rk{font-size:12px;color:var(--mut)}
.rgrid{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.box{display:flex;flex-direction:column;gap:8px;min-width:0;padding:12px 14px;background:#fff;border:1px solid var(--bd);border-radius:12px}
.box h3{font-family:Roboto,sans-serif;font-weight:700;font-size:17px;text-transform:uppercase;letter-spacing:.08em}
.pill{display:inline-block;min-width:30px;padding:1px 6px;border-radius:999px;background:var(--tile);font-size:12px;font-weight:700;text-align:center}
.pill.rp-g{background:var(--navy);color:#fff}.pill.rp-b{background:var(--org);color:#1B1F24}
.pgrid{display:grid;gap:0 24px;grid-template-columns:minmax(0,1fr)}
@media (min-width:600px) and (min-height:560px){
  #app{max-width:920px}
  nav button{font-size:15px}
  .list{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
  .list{display:grid}
  .card.open{grid-column:1/-1}
  .chips{flex-wrap:wrap;overflow:visible;margin:0;padding:0}
  .tiles{grid-template-columns:repeat(8,minmax(0,1fr))}
  .courts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .det.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 28px;align-items:start}
  .det.g2 .tiles,.det.g2 .wide{grid-column:1/-1}
  .rgrid{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
  .rgrid .full{grid-column:1/-1}
  .pgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  main{padding:18px 24px 32px}
}
@media (min-width:1000px) and (min-height:560px){
  body{display:block}
  #app{max-width:none;display:grid;grid-template-columns:250px minmax(0,1fr);grid-template-rows:1fr}
  .top{position:sticky;top:0;height:100vh;align-self:start;display:flex;flex-direction:column;background:#212121;color:#fff}
  .bar{padding-top:8px;min-height:52px}
  .hero{flex-direction:column;align-items:flex-start;gap:12px;padding:20px 18px}
  .hero img{width:96px;height:96px}
  .hero .t1{font-size:24px}
  nav{display:flex;flex-direction:column;background:transparent;border:0;margin-top:10px}
  nav button{min-height:50px;padding:0 20px;background:transparent;color:#cfd3d8;text-align:left;font-size:16px;border-bottom:0;border-left:4px solid transparent}
  nav button:hover{background:rgba(255,255,255,.06)}
  nav button[aria-current=page]{color:#fff;background:rgba(255,255,255,.1);border-left-color:var(--org)}
  main{padding:28px 40px 48px;max-width:1360px;width:100%}
  .list{grid-template-columns:repeat(3,minmax(0,1fr))}
  .rgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .rgrid .full{grid-column:1/-1}
  .det.g2{grid-template-columns:repeat(3,minmax(0,1fr))}
  .pgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .rp h2{font-size:30px}
}
.shotcols{display:grid;gap:12px 24px;grid-template-columns:minmax(0,1fr)}
.printonly{display:none}
@media (min-width:600px) and (min-height:560px){.shotcols{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cmp-pick{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:end}
.cmp-pick label{display:flex;flex-direction:column;gap:2px;min-width:0;font-size:12px;font-weight:700;color:var(--mut)}
.cmp-pick .lbl{display:inline}
.cmp-pick select{width:100%;min-height:44px;padding:0 8px;border:1px solid #B8C4D0;border-radius:10px;background:#fff;color:var(--ink);font:inherit;font-size:15px;font-weight:700}
.cmp-pick .dot{display:none}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;flex-shrink:0}
.dot.a{background:var(--navy)}.dot.b{background:var(--org)}
.cmp-heads{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.cmp-team{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#fff;border:1px solid var(--bd);border-radius:12px;border-top:4px solid var(--navy)}
.cmp-team.b{border-top-color:var(--org)}
.cmp-team strong{display:block;font-size:16px}
.cmp-team .rk{display:block}
.cmp-two{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
.cv{text-align:center;padding:3px 2px;border-radius:5px;font-weight:600;font-size:13px}
.cv small{margin-left:4px;font-size:10px;font-weight:600;color:var(--mut)}
.cv.cwa{background:rgba(31,78,120,.16);font-weight:800}
.cv.cwb{background:rgba(255,156,27,.30);font-weight:800}
.cl{text-align:center;font-size:12.5px;color:var(--mut)}
@media (min-width:600px) and (min-height:560px){.cmp-two{grid-template-columns:repeat(2,minmax(0,1fr))}.cmp-pick{max-width:640px}}

.qgrid{display:flex;flex-direction:column;gap:12px}
.qb.on{color:var(--navy);text-decoration:none;box-shadow:inset 3px 0 0 var(--navy);padding-left:8px}
@media (min-width:600px) and (min-height:560px){
  .tr{grid-template-columns:var(--cw,var(--c))}
  .rgrid{display:block;column-count:2;column-gap:12px}
  .rgrid>.box{break-inside:avoid;margin:0 0 12px;width:100%}
  .rgrid>.box.full{column-span:all}
  .det.g2{display:block;column-count:2;column-gap:28px}
  .det.g2>*{break-inside:avoid;margin-bottom:16px}
  .det.g2>.tiles,.det.g2>.wide{column-span:all}
  .sub{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .qgrid.has{display:grid;grid-template-columns:minmax(440px,.9fr) 1.6fr;align-items:start}
  .qgrid .qleft{position:sticky;top:12px}
}
@media (min-width:1000px) and (min-height:560px){
  .rgrid{column-count:3}
  .det.g2{column-count:3}
  .qgrid.has .det.g2{column-count:2}
}
@media print{
  .tr{grid-template-columns:var(--cw,var(--c))}
  .rgrid{display:block;column-count:2;column-gap:8px}
  .rgrid>.box{break-inside:avoid;margin:0 0 8px}
  .rgrid>.box.full{column-span:all}
}
@page{size:A4;margin:12mm}
@media print{
  .shotpage{break-inside:avoid;page-break-inside:avoid}
  .shotpage .courts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .shotpage .shotcols{grid-template-columns:repeat(2,minmax(0,1fr))}
  .shotpage .court{max-width:none}
  body{font-size:12px}
  .tr{padding:1px 0;font-size:11px}
  .pill{padding:0 6px;font-size:11px}
  .box{padding:8px 10px;gap:5px}
  .rgrid,.rp{gap:8px}
  .rp p,.rp ul{font-size:12px;line-height:1.4}
  .gl{padding:2px 0}
  .chipvd{width:22px;height:22px;font-size:12px}
  html,body,#app{background:#fff!important}
  body{display:block}
  .top,.noprint,.chips{display:none!important}
  #app{display:block;max-width:none;background:#fff}
  main{padding:0}
  .rgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.rgrid .full{grid-column:1/-1}
  .box{break-inside:avoid;border-color:#bbb}
  .court{max-width:260px}
}

.blk{display:flex;background:#212121;padding:0 16px 8px;gap:6px}
.blk button{flex:1;min-height:40px;border:1px solid #5a5f66;background:transparent;color:#cfd3d8;border-radius:999px;font-size:14px;font-weight:700;letter-spacing:.04em}
.blk button[aria-current=true]{background:var(--org);border-color:var(--org);color:#1B1F24}
.chipvd.n{background:var(--tile);color:var(--mut);border:0}
.lrow{border-top:0;align-items:center}.lrow>span:nth-child(2){flex:1;min-width:0}
.lrow small{font-size:12px}.mut{color:var(--mut)}.chg{color:var(--red);font-style:normal;font-weight:700}
.lgo{background:var(--tile);border:0;border-radius:8px;padding:6px 10px;font-size:15px;min-height:36px}
.box.lcal .gl:first-child{border-top:0}.lnext{background:var(--ven);border-radius:8px;padding:0 6px;margin:0 -6px}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.06em;background:var(--tile);color:var(--mut)}
.tag.casa{background:var(--navy);color:#fff}
.nx{display:flex;align-items:center;gap:10px;font-size:20px}
.tr.me{background:var(--ven);border-radius:6px}.tr .vn{color:var(--red);font-weight:800}
.tr .sp{color:var(--navy);font-weight:700}.tr .sn{color:var(--red);font-weight:700}
.sech{margin:6px 0 2px;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
.vsr{display:grid;grid-template-columns:22px minmax(0,1fr) minmax(40px,1.2fr) 52px;align-items:center;gap:6px;padding:4px 6px;font-size:13px;border-radius:6px}
.vsr.on{background:var(--ven);font-weight:800}.vsr .n{color:var(--mut);text-align:right}.vsr .vv{text-align:right;font-weight:700}
.vsr .nm2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vsr .bw{display:block;height:10px;background:var(--tile);border-radius:5px;overflow:hidden}.vsr .bw i{display:block;height:100%;background:var(--navy);border-radius:5px}
.vsr.on .bw i{background:var(--red)}
@media (min-width:1000px) and (min-height:560px){.blk{padding:0 18px 4px}}
@media print{.blk{display:none}}
</style>
</head>
<body>
<div id="app">
<header class="top">
<div class="bar"><h1>FEB3 BA</h1><span id="head-right"></span></div>
<div class="hero"><img src="icons/icon-192.png" alt="Logo de la Tercera FEB"><div><div class="t1">Estadísticas</div><div class="t2">Tercera FEB 2026/2027 · Grupo B-A</div></div></div>
<div class="blk" id="blk" role="group" aria-label="Bloque"></div>
<nav aria-label="Secciones" id="tabs"></nav>
</header>
<main id="view"><p class="empty">Cargando datos…</p></main>
</div>
<script src="app.js"></script>
</body>
</html>
